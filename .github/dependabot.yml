# Keeps the SHA-pinned workflow actions and the npm lockfiles current. Every update arrives as a pull request and
# goes through the same required checks as any other change (plus dependency-review.yml).
# cooldown: a new version is proposed only once it is 5 days old (14 for a new npm major), the window in which hijacked
# or broken npm releases are usually caught and yanked. groups: one pull request per ecosystem for all minor and
# patch updates; majors stay separate pull requests.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # github-actions supports only default-days (Dependabot rejects semver-*-days for this ecosystem)
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
      semver-major-days: 14
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node follows the Node major the app and CI run on (24), not the newest Node
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 waits for typescript-eslint to accept it (its peer range stops below 6); move both in one PR
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
      semver-major-days: 14
    groups:
      website-minor-patch:
        update-types: [minor, patch]
  # cloud/Dockerfile: the node:24-bookworm-slim base image is pinned by digest; this proposes digest bumps
  - package-ecosystem: docker
    directory: /cloud
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    ignore:
      # the image follows the Node major the app and CI run on (24)
      - dependency-name: node
        update-types: ['version-update:semver-major']
  # the agent CLIs baked into the cloud image (cloud/agent-clis/package-lock.json). deploy.test.ts fails a bump until
  # the version table in cloud/README.md matches, so add that edit to the pull request
  - package-ecosystem: npm
    directory: /cloud/agent-clis
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 5
      semver-major-days: 14
    groups:
      agent-clis:
        update-types: [minor, patch]
