# Keeps the SHA-pinned workflow actions and the npm lockfiles current. Every update arrives as a pull request and
# goes through the same required checks as any other change (plus dependency-review.yml).
# cooldown: a new version is proposed only once it is 5 days old (14 for a new npm major), the window in which hijacked
# or broken npm releases are usually caught and yanked. groups: one pull request per ecosystem for all minor and
# patch updates; majors stay separate pull requests.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # github-actions supports only default-days (Dependabot rejects semver-*-days for this ecosystem)
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
      semver-major-days: 14
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node follows the Node major the app and CI run on (24), not the newest Node
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
      semver-major-days: 14
    groups:
      website-minor-patch:
        update-types: [minor, patch]
