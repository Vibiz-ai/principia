name: Bug report
description: Report a reproducible problem
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a minimal example without private repositories, transcripts or credentials.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit, macOS version and chip
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Agent CLI and version, if relevant
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or screenshots
      description: Remove keys, account details and private project data before uploading.
