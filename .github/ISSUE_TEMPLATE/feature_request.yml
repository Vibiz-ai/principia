name: Feature request
description: Suggest an improvement
body:
  - type: textarea
    id: problem
    attributes:
      label: What task are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to help implement or test this.
