# Publishes the signed, notarized macOS release for a version tag (docs/RELEASING.md §5.2), in two jobs so that no
# dependency's install script ever runs next to the signing secrets:
#
#   build             no secrets, no environment, read-only token. `npm ci` (with every package's install scripts) and
#                     `scripts/release-mac.mjs --build-only`: the UNSIGNED Principia.app, archived with ditto and
#                     uploaded as an artifact (its SHA-256 passed on as a job output).
#   sign-and-publish  the `release` environment (approval + its secrets). Never runs `npm ci` or any package code: it
#                     checks out the repository for the release scripts, which use Node built-ins and Apple's tools only
#                     (scripts/mac-sign.mjs, update-info.mjs, release-assets.mjs). It downloads the app (checking its
#                     SHA-256), imports the Developer ID certificate into a temporary keychain, signs the app inside-out
#                     with the hardened runtime and entitlements, notarizes and staples it, makes the updater zip and
#                     the dmg (signed, notarized, stapled), writes latest-mac.yml / beta-mac.yml and SHA256SUMS.txt,
#                     verifies everything and uploads a draft release (`--prepackaged ... --draft-only`). Then the
#                     signing material is deleted, the files get a build-provenance attestation, and the draft is
#                     published (`--publish-draft`).
#   post-release      dispatches post-release.yml (a release published with GITHUB_TOKEN fires no `release` event).
#
# The split keeps the certificate and the notary key away from third-party code. It does not make the build itself
# trustworthy: the app is whatever `npm ci` + the build produced from package-lock.json, which is reviewed (CODEOWNERS)
# and checked by dependency review.
#
# Started by pushing a `v*` tag, or by release-please.yml (workflow_dispatch on the tag it created: a tag created with
# GITHUB_TOKEN triggers no push run). Either way the run's ref is the tag; a dispatch on a branch does nothing.
name: release
on:
  push:
    # v*-preview.* tags are unsigned previews published by hand (docs/RELEASING.md §6.2): nothing to build or sign
    tags: ['v*', '!v*-preview.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # one group per tag: with a single shared group, a third release queued while one waits on approval or signing would
  # silently cancel the second (pending) one. Two runs for the same tag still queue one after the other.
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: build the unsigned app
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      archive-sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # no dependency cache in the release build: a cache written by another workflow must never feed a release
          package-manager-cache: false
      # npm ci checks every package against package-lock.json's integrity hashes; this job holds no secret
      - run: npm ci
      - name: Build the unsigned app
        run: node scripts/release-mac.mjs "${GITHUB_REF_NAME#v}" --ci --build-only
      - name: Archive it
        id: archive
        run: |
          set -euo pipefail
          # ditto keeps the bundle's symlinks, modes and extended attributes (an artifact upload alone would not)
          ditto -c -k --keepParent "release/${GITHUB_REF_NAME#v}/mac-arm64/Principia.app" "$RUNNER_TEMP/Principia-unsigned-app.zip"
          echo "sha256=$(shasum -a 256 "$RUNNER_TEMP/Principia-unsigned-app.zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: principia-unsigned-app
          path: ${{ runner.temp }}/Principia-unsigned-app.zip
          if-no-files-found: error
          retention-days: 3
          compression-level: 0 # already a zip

  sign-and-publish:
    name: sign, notarize and publish
    needs: build
    runs-on: macos-15
    environment: release
    timeout-minutes: 90
    permissions:
      contents: write # the draft release and its files
      id-token: write # Sigstore signing of the build-provenance attestation
      attestations: write # stores the attestation on the repository
    steps:
      # the release scripts, entitlements and dmg layout only: nothing is installed in this job (no npm ci, no node_modules)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: principia-unsigned-app
          path: ${{ runner.temp }}/unsigned
      - name: Unpack the unsigned app (checking it is the build job's archive)
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.archive-sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/unsigned/Principia-unsigned-app.zip"
          echo "$EXPECTED_SHA256  $archive" | shasum -a 256 -c - \
            || { echo "::error::the downloaded app is not the archive the build job uploaded"; exit 1; }
          ditto -x -k "$archive" "$RUNNER_TEMP/unsigned"
          test -d "$RUNNER_TEMP/unsigned/Principia.app"

      - name: Import the Developer ID certificate into a temporary keychain
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/principia-signing.keychain-db"
          if [ -z "$MAC_CERT_P12_BASE64" ] || [ -z "$MAC_CERT_PASSWORD" ]; then
            echo "::error::MAC_CERT_P12_BASE64 and MAC_CERT_PASSWORD must be set in the release environment"
            exit 1
          fi
          umask 077
          kc_pass="$(openssl rand -base64 32)"
          echo "::add-mask::$kc_pass"
          p12="$RUNNER_TEMP/principia-signing.p12"
          printf '%s' "$MAC_CERT_P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$kc_pass" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$kc_pass" "$KEYCHAIN"
          security import "$p12" -k "$KEYCHAIN" -f pkcs12 -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign > /dev/null
          rm -f "$p12"
          # Apple's Developer ID intermediate (G2), checked against its SHA-256, so the identity is valid on any runner
          ca="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          curl -fsSL --proto '=https' https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$ca"
          echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $ca" | shasum -a 256 -c - > /dev/null \
            || { echo "::error::Apple's Developer ID G2 certificate does not match its pinned SHA-256"; exit 1; }
          security import "$ca" -k "$KEYCHAIN" > /dev/null
          rm -f "$ca"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$KEYCHAIN" > /dev/null
          # put it first in the search list, keeping the runner's own keychains after it
          security list-keychains -d user | xargs security list-keychains -d user -s "$KEYCHAIN"
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          count="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -c '"Developer ID Application:' || true)"
          echo "Developer ID Application identities in the temporary keychain: $count"

      - name: Write the App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::error::APPLE_API_KEY_P8 must be set in the release environment"
            exit 1
          fi
          NOTARY_DIR="$RUNNER_TEMP/principia-notary"
          umask 077
          mkdir -p "$NOTARY_DIR"
          chmod 700 "$NOTARY_DIR"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$NOTARY_DIR/AuthKey.p8"
          chmod 600 "$NOTARY_DIR/AuthKey.p8"
          echo "APPLE_API_KEY=$NOTARY_DIR/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Sign, notarize, staple, package, verify and upload a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node scripts/release-mac.mjs "${GITHUB_REF_NAME#v}" --ci --prepackaged "$RUNNER_TEMP/unsigned/Principia.app" --draft-only

      - name: Delete the temporary keychain and the API key
        if: always()
        run: |
          KEYCHAIN="$RUNNER_TEMP/principia-signing.keychain-db"
          if [ -f "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -rf "$RUNNER_TEMP/principia-notary" "$RUNNER_TEMP/principia-signing.p12" "$RUNNER_TEMP/DeveloperIDG2CA.cer"

      # verify a download with: gh attestation verify Principia-arm64.dmg -R Vibiz-ai/principia (RELEASING.md §5.3)
      - name: Attest build provenance of the dmg, zip and checksums
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*/Principia-*.dmg
            release/*/Principia-*.zip
            release/*/SHA256SUMS.txt

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-mac.mjs "${GITHUB_REF_NAME#v}" --ci --publish-draft

  # post-release.yml checks the published download on a fresh Mac. A release published with this workflow's
  # GITHUB_TOKEN triggers no `release` event, so it is dispatched (workflow_dispatch is GitHub's exception), from the
  # default branch's copy of the workflow, in a job of its own: the signing job never holds `actions: write`.
  post-release:
    needs: sign-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run post-release.yml --repo "$REPO" --ref "$DEFAULT_BRANCH" -f tag="$GITHUB_REF_NAME"
