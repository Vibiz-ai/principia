# The iPhone app (docs/IOS.md): SwiftLint, then build and unit tests on the simulator, exactly as the docs run them
# (xcodegen generate, xcodebuild with CODE_SIGN_IDENTITY=-: ad-hoc signing, no Apple team or account needed). The
# PrincipiaLiveUITests target needs a real, paired Mac and stays out (it is only in the PrincipiaLive scheme).
#
# Called from Checks (ci.yml) on pull requests and main pushes that touch ios/; `all-green` counts it when it ran and
# allows the skip otherwise. Also runs by hand.
name: ios
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: ghcr.io/realm/swiftlint:0.65.1@sha256:f47e083201e47a136cda5ae847595bfe00226c444ca226fa74fa5dc648a9b057
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # errors fail, warnings become annotations (ios/.swiftlint.yml); from the root so the paths are the repo's
      - run: swiftlint lint --quiet --reporter github-actions-logging --config ios/.swiftlint.yml
  build-and-test:
    name: build and unit tests
    runs-on: macos-15
    timeout-minutes: 30
    # job level, not workflow level: called from ci.yml, `github.workflow` would be the caller's name and share its group.
    # One group per pull request; any other run gets its own (run_id): a pending job in a shared group is cancelled as
    # soon as a newer one queues (a nightly run or the next merge), which would fail all-green on main.
    concurrency:
      group: ios-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      # deployment target iOS 26: macos-15's default Xcode is 16.x, so pick 26.2 and its own simulator runtime
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - run: xcodegen generate
      - name: Cache DerivedData
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ios/build
            !ios/build/Logs
          key: ios-dd-xcode26.2-${{ hashFiles('ios/project.yml') }}-${{ hashFiles('ios/Principia/**', 'ios/PrincipiaTests/**') }}
          restore-keys: ios-dd-xcode26.2-${{ hashFiles('ios/project.yml') }}-
      - name: Build
        run: >-
          xcodebuild -project Principia.xcodeproj -scheme Principia -destination "$DESTINATION"
          -derivedDataPath build CODE_SIGN_IDENTITY=- build
      - name: Unit tests
        timeout-minutes: 15
        run: >-
          xcodebuild -project Principia.xcodeproj -scheme Principia -destination "$DESTINATION"
          -derivedDataPath build -resultBundlePath "$RUNNER_TEMP/PrincipiaTests.xcresult" CODE_SIGN_IDENTITY=- test
      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/PrincipiaTests.xcresult
          retention-days: 7
          if-no-files-found: ignore
