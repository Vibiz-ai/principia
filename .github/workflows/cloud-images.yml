# Publishes the Principia Cloud image to ghcr.io/vibiz-ai/principia-cloud (CLOUD.md §12.1), so `docker compose up -d`
# and the Render button need no clone and no build. Runs on version tags and by hand; it pushes images only and never
# deploys anything. The Open Passport host sources come from that repository as a named build context.
name: cloud-images
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: cloud-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  principia-cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/vibiz-ai/principia-cloud
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: cloud/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-contexts: open-passport=https://github.com/Vibiz-ai/open-passport.git#main
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
