appId: ai.vibiz.hive
productName: Principia
copyright: Copyright © 2026 Vibiz
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/node_modules/*/{test,tests,__tests__,docs,example,examples}/**'
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/node-pty/**'
# principia:// links (src/main/deepLinks.ts): the packaged app registers itself; they only ever open a page
protocols:
  - name: Principia link
    schemes: [principia]
npmRebuild: false # @electron/rebuild already ran in postinstall
extraResources:
  - from: resources
    to: resources
    filter: ['**/*', '!brand/**'] # README art, not needed in the app
mac:
  # docs/RELEASING.md: dmg for people downloading from the site, zip for the updater (electron-updater installs
  # from the zip). Apple Silicon only. Stable names, so
  # https://github.com/Vibiz-ai/principia/releases/latest/download/Principia-arm64.dmg always is the newest
  # release; scripts/release-mac.mjs also uploads a versioned copy of the dmg.
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  artifactName: Principia-${arch}.${ext}
  category: public.app-category.developer-tools
  icon: build/icon.icns
  darkModeSupport: true
  minimumSystemVersion: '13.0' # Electron's own minimum (macOS Ventura)
  # Releases (scripts/release-mac.mjs) build the app UNSIGNED here (identity null, notarize false) and sign it with
  # scripts/mac-sign.mjs (codesign inside-out, hardened runtime, the entitlement files below, notarytool, stapler),
  # so the CI signing job needs no node_modules (RELEASING.md §5.2). The settings below are electron-builder's own
  # signing for anyone running it directly; `npm run dist` turns identity discovery off, so it stays unsigned.
  # Signing identity: never written here.
  hardenedRuntime: true
  # Entitlements (plists cannot carry comments: codesign's parser rejects them, so the reasons live here).
  # build/entitlements.mac.plist, the app itself:
  #   - cs.allow-jit: V8 compiles JavaScript to machine code at run time: the main process, and Principia's own
  #     binary run as node (ELECTRON_RUN_AS_NODE=1) for the memory, hive, gateway and browser MCP servers.
  #   - automation.apple-events: agents in Principia terminals (claude, codex, a shell) may run osascript to drive
  #     other apps, and macOS holds the responsible app (Principia) to the hardened runtime's Apple Events rule.
  #     NSAppleEventsUsageDescription below is the question macOS asks first.
  # build/entitlements.mac.inherit.plist, every nested binary (renderer / GPU / utility helpers, the native modules,
  # node-pty's spawn-helper): cs.allow-jit only, the helpers run V8 too.
  # Left out on purpose:
  #   - cs.allow-unsigned-executable-memory: V8 only needs MAP_JIT (allow-jit); the packaged build starts, opens
  #     the database and runs terminals without it.
  #   - cs.disable-library-validation: everything Principia loads is inside the app and signed by the same Developer
  #     ID (Electron Framework, better-sqlite3 and node-pty .node files, spawn-helper). claude, codex and shells are
  #     separate processes with their own signatures; spawning them needs no entitlement. Only the ad-hoc dry run
  #     (build/entitlements.mac.adhoc.plist) adds it: an ad-hoc signature has no Team ID to match.
  #   - allow-dyld-environment-variables, device.camera / audio-input, sandbox keys: not used.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # Notarization credentials come from the environment only: APPLE_API_KEY (path to the .p8) + APPLE_API_KEY_ID +
  # APPLE_API_ISSUER, or APPLE_KEYCHAIN_PROFILE (a `xcrun notarytool store-credentials` profile). scripts/release-mac.mjs
  # passes them to notarytool itself and refuses to publish without them.
  notarize: true
  extendInfo:
    CFBundleName: Principia
    CFBundleDisplayName: Principia
    LSApplicationCategoryType: public.app-category.developer-tools
    NSAppleEventsUsageDescription: Principia opens files and folders in Finder.
dmg:
  # `npm run dist` only: release dmgs are made, signed, notarized and stapled by scripts/mac-sign.mjs (hdiutil)
  sign: false
  writeUpdateInfo: false
# Updates (src/main/updates.ts): the app reads latest-mac.yml from the newest GitHub release through the
# releases/latest/download redirect (no GitHub API call, no rate limit); with "Get beta updates" on, beta-mac.yml from
# the newest release including pre-releases (src/shared/updates.ts, RELEASING.md §4.1). electron-builder writes this
# feed into the app (app-update.yml); the manifests are written by scripts/update-info.mjs and uploaded by
# scripts/release-mac.mjs (gh release create), never by electron-builder: the build always runs with --publish never.
publish:
  provider: generic
  url: https://github.com/Vibiz-ai/principia/releases/latest/download
  channel: latest
