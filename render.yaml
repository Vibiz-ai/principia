# Principia Cloud on Render, one button (CLOUD.md §12.1):
#   https://render.com/deploy?repo=https://github.com/Vibiz-ai/principia
# One web service from the published image, with a disk. Render gives it an https URL (RENDER_EXTERNAL_URL): the cloud
# uses it for your connect link and serves your Open Passport on the same origin (PRINCIPIA_PASSPORT=embedded), so
# ChatGPT and Claude.ai connect with no tunnel and no second domain. Nothing to type: the master key is generated by
# Render and stays out of the disk. After the deploy, open the service's Logs and copy the line "Connect link: …".
# A persistent disk needs a paid instance type (Starter). One instance only: the store is files on the disk.
services:
  - type: web
    name: principia-cloud
    runtime: image
    image:
      url: ghcr.io/vibiz-ai/principia-cloud:latest
    plan: starter
    numInstances: 1
    healthCheckPath: /v1/health
    envVars:
      - key: PRINCIPIA_MASTER_KEY
        generateValue: true
      - key: PRINCIPIA_PASSPORT
        value: embedded
      - key: PRINCIPIA_DATA_DIR
        value: /data
      - key: PRINCIPIA_SECRETS_DIR
        value: /data/secrets
      - key: PRINCIPIA_WORKSPACE
        value: /data/workspace
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: '8787'
    disk:
      name: principia-data
      mountPath: /data
      sizeGB: 10
